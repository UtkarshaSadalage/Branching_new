<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Contact</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f3;
        }

        header {
            background: #263238;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .contact-container {
            width: 70%;
            margin: 40px auto;
            display: flex;
            gap: 30px;
        }

        .contact-info,
        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
            flex: 1;
        }

        .contact-info h2,
        .contact-form h2 {
            color: #1565c0;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        footer {
            margin-top: 50px;
            background: #263238;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            .contact-container {
                width: 90%;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>We would love to hear from you</p>
    </header>

    <main class="contact-container">

        <section class="contact-info">
            <h2>Get in Touch</h2>

            <p>
                If you have any questions or suggestions,
                feel free to contact us.
            </p>

            <p><strong>Email:</strong> support@techzone.com</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Location:</strong> Bengaluru, Karnataka</p>
        </section>

        <section class="contact-form">
            <h2>Send Message</h2>

            <form>
                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Message</label>
                <textarea placeholder="Enter your message"></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 TechZone. All Rights Reserved.</p>
    </footer>

</body>
</html>
